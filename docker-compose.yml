services:
  # 1. Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: aca_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: ai_career_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_career_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. S3 Object Storage (MinIO)
  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    # image: minio/minio:latest
    image: local-minio:dev
    container_name: aca_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # MinIO Web Console UI
    volumes:
      - minio_data:/data

  # create-bucket service removed; bucket will be created by app on startup if missing
  # 4. Next.js App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aca_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:123@postgres:5432/ai_career_assistant"
      AUTH_SECRET: "replace-with-a-long-random-secret"
      S3_ENDPOINT: "http://minio:9000"
      S3_REGION: "us-east-1"
      S3_ACCESS_KEY_ID: "minioadmin"
      S3_SECRET_ACCESS_KEY: "minioadmin"
      S3_BUCKET_NAME: "ai-career-assistant"
      S3_FORCE_PATH_STYLE: "true"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"

volumes:
  postgres_data:
  minio_data:
