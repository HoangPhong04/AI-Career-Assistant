version: "3.8"

    services:
      # 1. Cơ sở dữ liệu PostgreSQL
      postgres:
        image: postgres:16-alpine
        container_name: aca_postgres
        restart: always
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123
          POSTGRES_DB: ai_career_assistant
        ports:
          - "5432:5432"
        volumes:
          - postgres_data:/var/lib/postgresql/data
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres -d ai_career_assistant"]
          interval: 5s
          timeout: 5s
          retries: 5

      # 2. S3 Object Storage (MinIO)
      minio:
        image: minio/minio:latest
        container_name: aca_minio
        restart: always
        environment:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        command: server /data --console-address ":9001"
        ports:
          - "9000:9000"   # S3 API Port
          - "9001:9001"   # MinIO Web Console UI
        volumes:
          - minio_data:/data

      # 3. Tự động khởi tạo Bucket S3 khi MinIO bật lên
      create-bucket:
        image: minio/mc:latest
        container_name: aca_create_bucket
        depends_on:
          - minio
        entrypoint: >
          /bin/sh -c "
          /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin;
          /usr/bin/mc mb localminio/ai-career-assistant || true;
          /usr/bin/mc anonymous set download localminio/ai-career-assistant || true;
          exit 0;
          "

      # 4. Next.js App
      app:
        build:
          context: .
          dockerfile: Dockerfile
        container_name: aca_app
        restart: always
        depends_on:
          postgres:
            condition: service_healthy
          minio:
            condition: service_started
        ports:
          - "3000:3000"
        environment:
          NODE_ENV: production
          DATABASE_URL: "postgresql://postgres:123@postgres:5432/ai_career_assistant"
          AUTH_SECRET: "replace-with-a-long-random-secret"
          S3_ENDPOINT: "http://minio:9000"
          S3_REGION: "us-east-1"
          S3_ACCESS_KEY_ID: "minioadmin"
          S3_SECRET_ACCESS_KEY: "minioadmin"
          S3_BUCKET_NAME: "ai-career-assistant"
          S3_FORCE_PATH_STYLE: "true"
          GEMINI_API_KEY: "${GEMINI_API_KEY}"

    volumes:
      postgres_data:
      minio_data: